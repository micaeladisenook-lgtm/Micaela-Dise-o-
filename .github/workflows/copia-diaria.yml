# Copia de seguridad automática todas las noches (03:17 hora argentina).
# Necesita dos "secrets" en GitHub: APP_URL (la dirección publicada) y COPIA_TOKEN (la misma clave que en la app).
# También mantiene despierta la base de datos gratuita de Supabase.
name: Copia de seguridad diaria
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir la copia a la app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          COPIA_TOKEN: ${{ secrets.COPIA_TOKEN }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$COPIA_TOKEN" ]; then echo "Faltan los secrets APP_URL / COPIA_TOKEN"; exit 0; fi
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $COPIA_TOKEN" "$APP_URL/api/copia/automatica" -o /dev/null
          echo "Copia guardada"
